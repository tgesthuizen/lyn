name: CMake CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  INSTALL_DIR: ${{ github.workspace }}/install

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, ReleaseLTO]

    runs-on: ubuntu-latest
    container: debian:testing

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Install deps differently on Ubuntu vs Debian container
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake ninja-build git \
            gcc g++ clang \
            binutils-arm-none-eabi gcc-arm-none-eabi

      - name: Configure CMake
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.build_type }}" = "ReleaseLTO" ]; then
            EXTRA_FLAGS="-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON"
          fi

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type == 'ReleaseLTO' && 'Release' || matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_DIR }} \
            $EXTRA_FLAGS

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: |
          ctest --test-dir build \
            --output-on-failure \
            --no-compress-output \
            --output-junit build/test-results.xml

      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/test-results.xml

      - name: Install
        run: cmake --build build --target install

      # Only upload build artifacts for main branch
      - name: Upload artifacts (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lync-${{ matrix.build_type }}
          path: ${{ env.INSTALL_DIR }}
